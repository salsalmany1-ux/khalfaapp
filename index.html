    <script>
        const SHEETDB_API_URL = "https://sheetdb.io/api/v1/67b18eci9714i";
        const ADMIN_PHONE = "9647833837468";
        const ADMIN_EMAIL = "s.alsalmany1@gmail.com";

        let khalafas = [];
        let categories = ["الكل"];
        let currentCategory = "الكل";
        let currentSort = "default";

        // PWA Manifest setup
        const manifestData = {
            name: "خلفة - دليل الحرفيين",
            short_name: "خلفة",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#020617",
            theme_color: "#f59e0b",
            icons: [{ src: "https://cdn-icons-png.flaticon.com/512/2954/2954848.png", sizes: "512x512", type: "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(event) {});`;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
        }

        // جلب البيانات حصرياً من SheetDB مع نظام احتياطي يضمن عدم بقاء الصفحة فارغة
        async function loadFromSheet() {
            try {
                const res = await fetch(SHEETDB_API_URL + "?t=" + Date.now(), { cache: "no-store" });
                const data = await res.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    const loaded = [];
                    const catSet = new Set(["الكل"]);

                    data.forEach((row, idx) => {
                        const name = row['الاسم'] || row['name'] || '';
                        if (!name) return;

                        const cat = row['التخصص'] || row['category'] || "عام";
                        catSet.add(cat);

                        let vipVal = row['VIP'] || row['vip'];
                        let isVip = (vipVal === 'نعم' || vipVal === 'yes' || vipVal === true || vipVal === '1');

                        loaded.push({
                            id: idx + 1,
                            name: name,
                            category: cat,
                            area: row['المنطقة'] || row['area'] || "الموصل",
                            phone: row['الهاتف'] || row['phone'] || "",
                            workingHours: row['ساعات العمل'] || row['workingHours'] || "يومياً",
                            vip: isVip,
                            rating: parseFloat(row['التقييم'] || row['rating']) || 5.0,
                            ratingsCount: parseInt(row['عدد التقييمات'] || row['ratingsCount']) || 1
                        });
                    });

                    if (loaded.length > 0) {
                        khalafas = loaded;
                        categories = Array.from(catSet);
                        renderCategories();
                        renderKhalafas();
                        return;
                    }
                }
                
                // إذا كان الجدول فارغاً
                document.getElementById('khalafas-list').innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">جدول البيانات فارغ حالياً. قم بإضافة أول حرفي عبر زر "سجّل كـ خلفة".</div>`;
            } catch (e) {
                console.error("SheetDB Error:", e);
                document.getElementById('khalafas-list').innerHTML = `<div class="text-center py-12 text-rose-400 text-xs">تعذر الاتصال بجدول الاكسل. تحقق من الإنترنت.</div>`;
            }
        }

        window.onload = async function() {
            await loadFromSheet();
            setTimeout(() => {
                if (window.AdProvider) { window.AdProvider.push({}); }
            }, 800);
        };

        function renderCategories() {
            const container = document.getElementById('categories-container');
            let html = '';
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs whitespace-nowrap transition ${currentCategory === cat ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'}">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderKhalafas();
        }

        function setSortFilter(sortType) {
            currentSort = sortType;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (btn.getAttribute('data-sort') === sortType) {
                    btn.className = "sort-btn px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold shrink-0 transition";
                } else {
                    btn.className = "sort-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 shrink-0 transition";
                }
            });
            renderKhalafas();
        }

        function renderKhalafas() {
            const list = document.getElementById('khalafas-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = khalafas.filter(k => {
                let matchesCat = currentCategory === 'الكل' || k.category === currentCategory;
                let matchesSearch = k.name.toLowerCase().includes(search) || k.area.toLowerCase().includes(search) || k.category.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            if (currentSort === 'default') filtered.sort((a, b) => b.vip - a.vip);
            else if (currentSort === 'newest') filtered.sort((a, b) => b.id - a.id);
            else if (currentSort === 'top_rated') filtered.sort((a, b) => b.rating - a.rating);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((k, index) => {
                html += `
                <div class="bg-slate-900 border ${k.vip ? 'border-amber-500/60 shadow-lg' : 'border-slate-800'} rounded-2xl p-4 relative">
                    ${k.vip ? '<span class="absolute top-3 left-3 bg-amber-500 text-slate-950 px-2 py-0.5 rounded-lg text-[10px] font-black">VIP</span>' : ''}
                    <span class="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 rounded-md font-bold">${k.category}</span>
                    <h3 class="text-base font-bold text-slate-100 mt-1">${k.name}</h3>
                    <div class="text-xs text-slate-400 mt-2 space-y-1">
                        <p><i class="fa-solid fa-location-dot text-amber-500"></i> ${k.area}</p>
                        <p><i class="fa-solid fa-clock text-amber-400"></i> ${k.workingHours}</p>
                    </div>
                    <div class="flex items-center gap-2 mt-3 pt-2 border-t border-slate-800">
                        <a href="tel:${k.phone}" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs text-center"><i class="fa-solid fa-phone"></i> اتصال</a>
                        <a href="whatsapp://send?phone=${k.phone.replace(/^0/, '964')}" class="flex-1 bg-emerald-600/20 text-emerald-400 font-bold py-2.5 rounded-xl text-xs text-center"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                    </div>
                </div>`;

                if (index === 1) {
                    html += `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center my-4"><div id="container-193518952cb65746281f7b50a674ba6c"></div></div>`;
                }
            });
            list.innerHTML = html;
        }

        // إرسال البيانات إلى SheetDB وجدول الاكسل مباشرة
        async function submitKhalfa(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const cat = document.getElementById('reg-category').value.trim();
            const area = document.getElementById('reg-area').value.trim();
            const workingHours = document.getElementById('reg-hours').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const errorBox = document.getElementById('form-error-box');
            const errorText = document.getElementById('form-error-text');

            if (!name || !cat || !area || !workingHours || !phone) {
                errorText.textContent = 'يرجى ملء جميع الحقول الإجبارية.';
                errorBox.classList.remove('hidden');
                return;
            }

            const phoneRegex = /^07\d{9}$/;
            if (!phoneRegex.test(phone)) {
                errorText.textContent = 'رقم الهاتف يجب أن يتكون من 11 رقماً ويبدأ بـ 07.';
                errorBox.classList.remove('hidden');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال لجدول الاكسل...';

            const payload = {
                "data": [
                    {
                        "الاسم": name,
                        "التخصص": cat,
                        "المنطقة": area,
                        "الهاتف": phone,
                        "ساعات العمل": workingHours,
                        "VIP": "لا",
                        "التقييم": 5.0,
                        "عدد التقييمات": 1
                    }
                ]
            };

            try {
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('تم إرسال وحفظ البيانات في جدول الاكسل بنجاح!');
                    closeRegisterModal();
                    document.getElementById('register-form').reset();
                    errorBox.classList.add('hidden');
                    await loadFromSheet();
                } else {
                    errorText.textContent = 'فشل الحفظ، تأكد من مطابقة أسماء الأعمدة في الجدول.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = 'حدث خطأ في الاتصال بالشبكة.';
                errorBox.classList.add('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال';
            }
        }

        function openRegisterModal() { document.getElementById('form-error-box').classList.add('hidden'); document.getElementById('register-modal').classList.remove('hidden'); }
        function closeRegisterModal() { document.getElementById('register-modal').classList.add('hidden'); }
        function openSupportModal() { document.getElementById('support-modal').classList.remove('hidden'); }
        function closeSupportModal() { document.getElementById('support-modal').classList.add('hidden'); }
        function openVipModal() { document.getElementById('vip-modal').classList.remove('hidden'); }
        function closeVipModal() { document.getElementById('vip-modal').classList.add('hidden'); }
        function openAdvertiseModal() { document.getElementById('advertise-modal').classList.remove('hidden'); }
        function closeAdvertiseModal() { document.getElementById('advertise-modal').classList.add('hidden'); }
        function openAdminLogin() { document.getElementById('admin-login-modal').classList.remove('hidden'); }
        function closeAdminLogin() { document.getElementById('admin-login-modal').classList.add('hidden'); }
        function checkAdminPassword() {
            if (document.getElementById('admin-pass-input').value === '7223') {
                closeAdminLogin();
                document.getElementById('admin-dashboard-modal').classList.remove('hidden');
            } else { alert('رمز المرور خاطئ'); }
        }
        function closeAdminDashboard() { document.getElementById('admin-dashboard-modal').classList.add('hidden'); }
        function openStandardWhatsApp(msg) { window.location.href = `https://api.whatsapp.com/send?phone=${ADMIN_PHONE}&text=${encodeURIComponent(msg)}`; }
        function sendSupportWhatsApp() { openStandardWhatsApp(document.getElementById('support-msg-text').value); }
        function sendSupportEmail() { window.location.href = `mailto:${ADMIN_EMAIL}?subject=شكوى&body=${encodeURIComponent(document.getElementById('support-msg-text').value)}`; }
    </script>
</body>
</html>
