    <script>
        const DEFAULT_SHEETDB_URL = "https://sheetdb.io/api/v1/67b18eci9714i";
        const ADMIN_PHONE = "9647833837468";
        const ADMIN_EMAIL = "s.alsalmany1@gmail.com";

        function getSheetUrl() {
            return (localStorage.getItem("khalfa_sheetdb_url") || DEFAULT_SHEETDB_URL).trim();
        }

        function setSheetUrl(newUrl) {
            localStorage.setItem("khalfa_sheetdb_url", newUrl.trim());
        }

        function isAppsScriptUrl(url) {
            return /script\.google\.com\/macros\/s\//i.test(url);
        }

        function resetDefaultSheetUrl() {
            localStorage.removeItem("khalfa_sheetdb_url");
            document.getElementById("admin-sheetdb-url").value = DEFAULT_SHEETDB_URL;
            testAndSaveSheetUrl();
        }

        let khalafas = [];
        let categories = ["الكل"];
        let areas = [
            "الجانب الأيسر - حي الزهور", "الجانب الأيسر - حي البكر", "الجانب الأيسر - حي المثنى", "الجانب الأيسر - حي المحددين", 
            "الجانب الأيسر - النبي يونس", "الجانب الأيسر - القوسيات", "الجانب الأيسر - المصارف", "الجانب الأيسر - حي المهندسين", 
            "الجانب الأيسر - حي الجامعة", "الجانب الأيسر - حي الشرطة", "الجانب الأيسر - حي السكر", "الجانب الأيسر - حي البريد", 
            "الجانب الأيسر - حي المالية", "الجانب الأيسر - حي النور", "الجانب الأيسر - حي الاعتماد", "الجانب الأيسر - حي التحرير", 
            "الجانب الأيسر - حي القادسية", "الجانب الأيسر - حي الحدباء", "الجانب الأيسر - حي العربي", "الجانب الأيسر - الصديق", "الجانب الأيسر - الوريورات",
            "الجانب الأيمن - الدواسة", "الجانب الأيمن - الدندان", "الجانب الأيمن - الفاروق", "الجانب الأيمن - حي العامل", 
            "الجانب الأيمن - الطيران", "الجانب الأيمن - الميدان", "الجانب الأيمن - وادي حجر", "الجانب الأيمن - وادي عكاب", 
            "الجانب الأيمن - المأمون", "الجانب الأيمن - التنك", "الجانب الأيمن - الهرمات", "الجانب الأيمن - رجم التشظي", 
            "الجانب الأيمن - الشفاء", "الجانب الأيمن - باب سنجار", "الجانب الأيمن - باب لكش", "الجانب الأيمن - المشاهدة", 
            "الجانب الأيمن - راس الجادة", "الجانب الأيمن - الكورنيش",
            "قضاء تلكيف ونواحيها", "قضاء الحمدانية ونواحيها", "قضاء شيخان ونواحيها", "قضاء تلعفر ونواحيها", "قضاء سنجار ونواحيها", "قضاء مخمور ونواحيها", "قضاء الحضر ونواحيها"
        ];

        let currentCategory = "الكل";
        let currentSort = "default";

        const manifestData = {
            name: "خلفة - دليل الحرفيين",
            short_name: "خلفة",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#020617",
            theme_color: "#f59e0b",
            icons: [{ src: "https://cdn-icons-png.flaticon.com/512/2954/2954848.png", sizes: "512x512", type: "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(event) {});`;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
        }

        function cleanField(row, keys, fallback = "") {
            for (const key of keys) {
                if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== "") {
                    return String(row[key]).trim();
                }
            }
            return fallback;
        }

        function buildSheetEndpoint(baseUrl) {
            const clean = baseUrl.trim();
            const sep = clean.includes("?") ? "&" : "?";
            return `${clean}${sep}_nocache=${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
        }

        function renderAreasSelect() {

        async function loadFromSheet(overrideUrl = null, notifyUser = false) {
            const listEl = document.getElementById('khalafas-list');
            const statusBadge = document.getElementById('sheet-status-badge');
            const targetUrl = (overrideUrl || getSheetUrl()).trim();

            if (statusBadge) {
                statusBadge.className = "text-[11px] text-amber-300";
                statusBadge.textContent = "جاري الفحص والتحميل...";
            }

            try {
                const response = await fetch(buildSheetEndpoint(targetUrl), {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });

                if (!response.ok) {
                    const errText = await response.text().catch(() => "");
                    throw new Error(`HTTP ${response.status}: ${errText.slice(0, 120)}`);
                }

                const data = await response.json();
                const rows = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : null);

                if (rows) {
                    const loaded = [];
                    const catSet = new Set(["الكل"]);
                    const areaSet = new Set(areas);

                    rows.forEach((row, idx) => {
                        const name = cleanField(row, ['الاسم', 'name']);
                        if (!name) return;

                        const cat = cleanField(row, ['التخصص', 'category'], "عام");
                        const areaVal = cleanField(row, ['المنطقة', 'area'], "الموصل");
                        const phoneVal = cleanField(row, ['الهاتف', 'phone'], "");
                        const hoursVal = cleanField(row, ['ساعات العمل', 'workingHours'], "يومياً");
                        const vipRaw = cleanField(row, ['VIP', 'vip'], "لا").toLowerCase();
                        const ratingRaw = parseFloat(cleanField(row, ['التقييم', 'rating'], "5.0"));
                        const countRaw = parseInt(cleanField(row, ['عدد التقييمات', 'ratingsCount'], "1"), 10);

                        catSet.add(cat);
                        areaSet.add(areaVal);

                        const isVip = (vipRaw === 'نعم' || vipRaw === 'yes' || vipRaw === 'true' || vipRaw === '1');

                        loaded.push({
                            id: idx + 1,
                            name: name,
                            category: cat,
                            area: areaVal,
                            phone: phoneVal,
                            workingHours: hoursVal,
                            vip: isVip,
                            rating: Number.isFinite(ratingRaw) ? ratingRaw : 5.0,
                            ratingsCount: Number.isFinite(countRaw) && countRaw > 0 ? countRaw : 1
                        });
                    });

                    khalafas = loaded;
                    categories = Array.from(catSet);
                    areas = Array.from(areaSet);
                    renderCategories();
                    renderAreasSelect();
                    renderKhalafas();
                    renderAdminList();

                    if (statusBadge) {
                        statusBadge.className = "text-[11px] text-emerald-400";
                        statusBadge.textContent = `متصل بنجاح (${loaded.length} سجل)`;
                    }
                    if (notifyUser) {
                        alert(`تم الاتصال وتحديث البيانات (${loaded.length} سجل).`);
                    }
                    return { ok: true, count: loaded.length };
                } else {
                    listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">لا توجد سجلات حالياً.</div>`;
                    if (statusBadge) {
                        statusBadge.className = "text-[11px] text-amber-400";
                        statusBadge.textContent = "تم الاتصال ولكن لم تُعثر على صفوف";
                    }
                    return { ok: true, count: 0 };
                }
            } catch (e) {
                console.error("SheetDB Sync Error:", e);
                listEl.innerHTML = `<div class="text-center py-12 text-rose-400 text-xs">تعذر تحميل البيانات، تأكد من رابط الربط أو صلاحيات الجدول.</div>`;
                if (statusBadge) {
                    statusBadge.className = "text-[11px] text-rose-400";
                    statusBadge.textContent = `فشل الاتصال: ${e.message}`;
                }
                if (notifyUser) {
                    alert(`فشل الاتصال بالجدول: ${e.message}`);
                }
                return { ok: false, error: e.message };
            }
        }

                return;
            }
            setSheetUrl(newUrl);
            const result = await loadFromSheet(newUrl, false);
            if (result.ok) {
                alert(`تم حفظ الرابط وتحديث البيانات (${result.count} سجل).`);
            } else {
                alert(`تم حفظ الرابط، لكن فشل الفحص: ${result.error}`);
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            let html = '';
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs whitespace-nowrap transition ${currentCategory === cat ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'}">${cat}</button>`;

        }

        function setSortFilter(sortType) {
            currentSort = sortType;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (btn.getAttribute('data-sort') === sortType) {
                    btn.className = "sort-btn px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold shrink-0 transition";
                } else {
                    btn.className = "sort-btn px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 shrink-0 transition";
                }
            });
            renderKhalafas();
        }

        function renderKhalafas() {
            const list = document.getElementById('khalafas-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = khalafas.filter(k => {
                let matchesCat = currentCategory === 'الكل' || k.category === currentCategory;
                let matchesSearch = k.name.toLowerCase().includes(search) || k.area.toLowerCase().includes(search) || k.category.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            if (currentSort === 'default') filtered.sort((a, b) => b.vip - a.vip);
            else if (currentSort === 'newest') filtered.sort((a, b) => b.id - a.id);
            else if (currentSort === 'top_rated') filtered.sort((a, b) => b.rating - a.rating);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((k, index) => {
                html += `
                <div class="bg-slate-900 border ${k.vip ? 'border-amber-500/60 shadow-lg' : 'border-slate-800'} rounded-2xl p-4 relative">
                    ${k.vip ? '<span class="absolute top-3 left-3 bg-amber-500 text-slate-950 px-2 py-0.5 rounded-lg text-[10px] font-black">VIP</span>' : ''}
                    <span class="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 rounded-md font-bold">${k.category}</span>
                    <h3 class="text-base font-bold text-slate-100 mt-1">${k.name}</h3>
                    <div class="text-xs text-slate-400 mt-2 space-y-1">
                        <p><i class="fa-solid fa-location-dot text-amber-500"></i> ${k.area}</p>
                        <p><i class="fa-solid fa-clock text-amber-400"></i> ${k.workingHours}</p>
                    </div>
                    <div class="flex items-center gap-2 mt-3 pt-2 border-t border-slate-800">
                        <a href="tel:${k.phone}" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs text-center"><i class="fa-solid fa-phone"></i> اتصال</a>
                        <a href="whatsapp://send?phone=${k.phone.replace(/^0/, '964')}" class="flex-1 bg-emerald-600/20 text-emerald-400 font-bold py-2.5 rounded-xl text-xs text-center"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                    </div>
                </div>`;

                if (index === 1) {
                    html += `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center my-4"><div id="container-193518952cb65746281f7b50a674ba6c"></div></div>`;
                }
            });
            list.innerHTML = html;
        }

        function renderAdminList() {
            const adminList = document.getElementById('admin-khalafas-list');
            if (!adminList) return;
            if (khalafas.length === 0) {
                adminList.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">لا توجد سجلات معروضة حالياً.</p>`;

                    </div>
                    <span class="px-2 py-0.5 rounded ${k.vip ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-800 text-slate-400'}">${k.vip ? 'VIP' : 'عادي'}</span>
                </div>
            `).join('');
        }

        async function submitKhalfa(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            let cat = document.getElementById('reg-category').value;
            const newCatInput = document.getElementById('reg-new-category').value.trim();
            let area = document.getElementById('reg-area').value;
            const newAreaInput = document.getElementById('reg-new-area').value.trim();
            let workingHours = document.getElementById('reg-hours').value;
            const newHoursInput = document.getElementById('reg-new-hours').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const errorBox = document.getElementById('form-error-box');
            const errorText = document.getElementById('form-error-text');

            if (!name) { errorText.textContent = 'يرجى إدخال الاسم أو اسم الورشة.'; errorBox.classList.remove('hidden'); return; }
            if (!cat) { errorText.textContent = 'يرجى اختيار التخصص أو المهنة.'; errorBox.classList.remove('hidden'); return; }
            if (cat === 'new_option' && !newCatInput) { errorText.textContent = 'يرجى كتابة اسم التخصص الجديد.'; errorBox.classList.remove('hidden'); return; }
            if (!area) { errorText.textContent = 'يرجى اختيار المنطقة أو القضاء.'; errorBox.classList.remove('hidden'); return; }
            if (area === 'new_area_option' && !newAreaInput) { errorText.textContent = 'يرجى كتابة اسم المنطقة أو الحي الجديد.'; errorBox.classList.remove('hidden'); return; }
            if (!workingHours) { errorText.textContent = 'يرجى اختيار ساعات العمل.'; errorBox.classList.remove('hidden'); return; }
            if (workingHours === 'new_hours_option' && !newHoursInput) { errorText.textContent = 'يرجى كتابة ساعات العمل.'; errorBox.classList.remove('hidden'); return; }

            const phoneRegex = /^07\d{9}$/;
            if (!phoneRegex.test(phone)) {
                errorText.textContent = 'رقم الهاتف يجب أن يتكون من 11 رقماً ويبدأ بـ 07.';
                errorBox.classList.remove('hidden');
                return;
            }

            if (cat === 'new_option') cat = newCatInput;
            if (area === 'new_area_option') area = newAreaInput;
            if (workingHours === 'new_hours_option') workingHours = newHoursInput;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال...';

            const rowObj = {
                "الاسم": name,
                "التخصص": cat,
                "المنطقة": area,
                "الهاتف": phone,
                "ساعات العمل": workingHours,
                "VIP": "لا",
                "التقييم": 5.0,
                "عدد التقييمات": 1
            };

            const targetUrl = getSheetUrl();

            try {
                let response;
                if (isAppsScriptUrl(targetUrl)) {
                    response = await fetch(targetUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'add', row: rowObj })
                    });
                } else {
                    response = await fetch(targetUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ "data": [rowObj] })
                    });
                }

                if (response.ok) {
                    alert('تمت الإضافة بنجاح');
                    closeRegisterModal();
                    document.getElementById('register-form').reset();
                    document.getElementById('new-category-div').classList.add('hidden');
                    document.getElementById('new-area-div').classList.add('hidden');
                    document.getElementById('new-hours-div').classList.add('hidden');
                    errorBox.classList.add('hidden');
                    await loadFromSheet();
                } else {
                    const errBody = await response.text().catch(() => "");
                    console.error("Sync POST failed:", response.status, errBody);
                    errorText.textContent = `تعذر إتمام الإضافة (${response.status}). تحقق من رابط الربط أو صلاحيات الجدول.`;
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Sync Network Error:", err);
                errorText.textContent = 'حدث خطأ في الاتصال بالشبكة.';
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال';
            }
        }
