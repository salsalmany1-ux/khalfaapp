    <script>

        const ADMIN_EMAIL = "s.alsalmany1@gmail.com";

        let khalafas = [
            { id: 101, name: "عمر الحيالي للكهرباء", category: "كهربائي", area: "الجانب الأيسر - حي البكر", phone: "07701234567", workingHours: "يومياً 8 صباحاً - 9 مساءً", vip: true, rating: 4.9, ratingsCount: 38 },
            { id: 102, name: "ورشة الفرات للتأسيسات والمجاري", category: "مجاري", area: "الجانب الأيمن - الدواسة", phone: "07709876543", workingHours: "من السبت للخميس", vip: false, rating: 4.7, ratingsCount: 19 }
        ];

        let categories = ["كهربائي", "مجاري", "تكييف وتبريد", "نجار", "حداد"];
        let areas = [
            "الجانب الأيسر - حي الزهور", "الجانب الأيسر - حي البكر", "الجانب الأيسر - حي المثنى", "الجانب الأيسر - حي المحددين", 
            "الجانب الأيسر - النبي يونس", "الجانب الأيسر - القوسيات", "الجانب الأيسر - المصارف", "الجانب الأيسر - حي المهندسين", 
            "الجانب الأيسر - حي الجامعة", "الجانب الأيسر - حي الشرطة", "الجانب الأيسر - حي السكر", "الجانب الأيسر - حي البريد", 
            "الجانب الأيسر - حي المالية", "الجانب الأيسر - حي النور", "الجانب الأيسر - حي الاعتماد", "الجانب الأيسر - حي التحرير", 
            "الجانب الأيسر - حي القادسية", "الجانب الأيسر - حي الحدباء", "الجانب الأيسر - حي العربي", "الجانب الأيسر - الصديق", "الجانب الأيسر - الوريورات",
            "الجانب الأيمن - الدواسة", "الجانب الأيمن - الدندان", "الجانب الأيمن - الفاروق", "الجانب الأيمن - حي العامل", 
            "الجانب الأيمن - الطيران", "الجانب الأيمن - الميدان", "الجانب الأيمن - وادي حجر", "الجانب الأيمن - وادي عكاب", 
            "الجانب الأيمن - المأمون", "الجانب الأيمن - التنك", "الجانب الأيمن - الهرمات", "الجانب الأيمن - رجم التشظي", 
            "الجانب الأيمن - الشفاء", "الجانب الأيمن - باب سنجار", "الجانب الأيمن - باب لكش", "الجانب الأيمن - المشاهدة", 
            "الجانب الأيمن - راس الجادة", "الجانب الأيمن - الكورنيش",
            "قضاء تلكيف ونواحيها", "قضاء الحمدانية ونواحيها", "قضاء شيخان ونواحيها", "قضاء تلعفر ونواحيها", "قضاء سنجار ونواحيها", "قضاء مخمور ونواحيها", "قضاء الحضر ونواحيها"
        ];

        let currentCategory = "الكل";
        let currentSort = "default";

        // قراءة البيانات من SheetDB (الاكسل)
        async function loadFromSheet() {
            if (!SHEETDB_API_URL) return;
            try {
                const res = await fetch(SHEETDB_API_URL + "?t=" + Date.now());
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    const loaded = [];
                    const updatedCategories = new Set(categories);
                    const updatedAreas = new Set(areas);

                    data.forEach((row, idx) => {
                        const name = row['الاسم'] || row['name'] || '';
                        if (!name) return;
                        
                        const cat = row['التخصص'] || row['category'] || "عام";
                        const areaVal = row['المنطقة'] || row['area'] || "الموصل";
                        updatedCategories.add(cat);
                        updatedAreas.add(areaVal);

                        let savedId = idx + 200;
                        let savedRatingData = localStorage.getItem('rating_' + savedId);
                        let finalRating = parseFloat(row['التقييم'] || row['rating']) || 5.0;
                        let finalCount = parseInt(row['عدد التقييمات'] || row['ratingsCount']) || 1;

                        if (savedRatingData) {
                            const parsedData = JSON.parse(savedRatingData);
                            finalRating = parsedData.rating;
                            finalCount = parsedData.count;
                        }

                        let vipVal = row['VIP'] || row['vip'];
                        let isVip = vipVal === 'نعم' || vipVal === 'yes' || vipVal === 'true' || vipVal === 1;

                        loaded.push({
                            id: savedId,
                            name: name,
                            category: cat,
                            area: areaVal,
                            phone: row['الهاتف'] || row['phone'] || "",
                            workingHours: row['ساعات العمل'] || row['workingHours'] || "يومياً (غير محدد)",
                            vip: isVip,
                            rating: finalRating,
                            ratingsCount: finalCount
                        });
                    });

                    if (loaded.length > 0) {
                        khalafas = loaded;
                        categories = Array.from(updatedCategories);
                        areas = Array.from(updatedAreas);
                        renderCategories();
                        renderAreasSelect();
                        renderKhalafas();
                    }
                }
            } catch (e) {
                console.error("Error loading SheetDB:", e);
            }
        }

        window.onload = async function() {
            renderCategories();
            renderAreasSelect();
            renderKhalafas();
            await loadFromSheet();
            setTimeout(() => {
                if (window.AdProvider) {
                    window.AdProvider.push({});
                }
            }, 800);
        };

        function renderCategories() {
            const container = document.getElementById('categories-container');
            let html = `<button onclick="filterCategory('الكل')" class="category-btn ${currentCategory === 'الكل' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'} px-4 py-2 rounded-xl text-xs whitespace-nowrap transition">الكل</button>`;
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${cat}')" class="category-btn ${currentCategory === cat ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'} px-4 py-2 rounded-xl text-xs whitespace-nowrap transition">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function renderAreasSelect() {
            const select = document.getElementById('reg-area');
            let html = `<option value="">اختر المنطقة أو القضاء...</option>`;
            areas.forEach(a => {
                html += `<option value="${a}">${a}</option>`;
            });
            html += `<option value="new_area_option" class="text-amber-400 font-bold">+ اقترح منطقة أو حي جديد...</option>`;
            select.innerHTML = html;
        }

        function filterCategory(cat) { currentCategory = cat; renderCategories(); renderKhalafas(); }

        function setSortFilter(sortType) {
            currentSort = sortType;
            renderKhalafas();
        }

        function isOpenNow(hoursText) {
            if (!hoursText) return true;
            let text = hoursText.toLowerCase();
            if (text.includes('مغلق') && text.includes('الجمعة')) {
                if (new Date().getDay() === 5) return false;
            }
            return true;
        }

        function renderKhalafas() {
            const list = document.getElementById('khalafas-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = khalafas.filter(k => {
                let matchesCat = currentCategory === 'الكل' || k.category === currentCategory;
                let matchesSearch = k.name.toLowerCase().includes(search) || k.area.toLowerCase().includes(search) || k.category.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            if (currentSort === 'default') filtered.sort((a, b) => b.vip - a.vip);
            else if (currentSort === 'newest') filtered.sort((a, b) => b.id - a.id);
            else if (currentSort === 'top_rated') filtered.sort((a, b) => b.rating - a.rating);
            else if (currentSort === 'open_now') filtered = filtered.filter(k => isOpenNow(k.workingHours));

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((k, index) => {
                html += `
                <div class="bg-slate-900 border ${k.vip ? 'border-amber-500/60 shadow-lg' : 'border-slate-800'} rounded-2xl p-4 relative">
                    ${k.vip ? '<span class="absolute top-3 left-3 bg-amber-500 text-slate-950 px-2 py-0.5 rounded-lg text-[10px] font-black">VIP</span>' : ''}
                    <h3 class="text-base font-bold text-slate-100">${k.name}</h3>
                    <p class="text-xs text-slate-400 mt-1">${k.category} - ${k.area}</p>
                    <div class="text-xs text-slate-400 mt-2 space-y-1">
                        <p><i class="fa-solid fa-clock text-amber-400"></i> ${k.workingHours}</p>
                        <p><i class="fa-solid fa-star text-amber-400"></i> ${k.rating} (${k.ratingsCount} تقييم)</p>
                    </div>
                    <div class="flex items-center gap-2 mt-3 pt-2 border-t border-slate-800">
                        <a href="tel:${k.phone}" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs text-center"><i class="fa-solid fa-phone"></i> اتصال</a>
                        <a href="whatsapp://send?phone=${k.phone.replace(/^0/, '964')}" class="flex-1 bg-emerald-600/20 text-emerald-400 font-bold py-2 rounded-xl text-xs text-center"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                    </div>
                </div>`;

                if (index === 1) {
                    html += `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center my-4"><div id="container-193518952cb65746281f7b50a674ba6c"></div></div>`;
                }
            });
            list.innerHTML = html;
        }

        // إرسال البيانات إلى جدول الاكسل عبر SheetDB
        async function submitKhalfa(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            let cat = document.getElementById('reg-category').value;
            let area = document.getElementById('reg-area').value;
            const workingHours = document.getElementById('reg-hours').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();

            if (!name || !cat || !area || !workingHours || !phone) {
                alert('يرجى ملء جميع الحقول الإجبارية.');
                return;
            }

            const payload = {
                "data": [
                    {
                        "الاسم": name,
                        "التخصص": cat,
                        "المنطقة": area,
                        "الهاتف": phone,
                        "ساعات العمل": workingHours,
                        "VIP": "لا",
                        "التقييم": 5.0,
                        "عدد التقييمات": 1
                    }
                ]
            };

            try {
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('تم إرسال البيانات وحفظها في جدول الاكسل بنجاح!');
                    closeRegisterModal();
                    loadFromSheet();
                    document.getElementById('register-form').reset();
                } else {
                    alert('فشل حفظ البيانات، تأكد من أعمدة الجدول.');
                }
            } catch (err) {
                alert('حدث خطأ في الاتصال.');
            }
        }

        function openRegisterModal() { document.getElementById('register-modal').classList.remove('hidden'); }
        function closeRegisterModal() { document.getElementById('register-modal').classList.add('hidden'); }
        function openSupportModal() { document.getElementById('support-modal').classList.remove('hidden'); }
        function closeSupportModal() { document.getElementById('support-modal').classList.add('hidden'); }
        function openVipModal() { document.getElementById('vip-modal').classList.remove('hidden'); }
        function closeVipModal() { document.getElementById('vip-modal').classList.add('hidden'); }
        function openAdvertiseModal() { document.getElementById('advertise-modal').classList.remove('hidden'); }
        function closeAdvertiseModal() { document.getElementById('advertise-modal').classList.add('hidden'); }
        function openAdminLogin() { document.getElementById('admin-login-modal').classList.remove('hidden'); }
        function closeAdminLogin() { document.getElementById('admin-login-modal').classList.add('hidden'); }
        function checkAdminPassword() {
            if (document.getElementById('admin-pass-input').value === '7223') {
                closeAdminLogin();
                document.getElementById('admin-dashboard-modal').classList.remove('hidden');
            } else { alert('رمز المرور خاطئ'); }
        }
        function closeAdminDashboard() { document.getElementById('admin-dashboard-modal').classList.add('hidden'); }
        function sendSupportWhatsApp() { openStandardWhatsApp(document.getElementById('support-msg-text').value); }
        function sendSupportEmail() { window.location.href = `mailto:${ADMIN_EMAIL}?subject=شكوى&body=${encodeURIComponent(document.getElementById('support-msg-text').value)}`; }
        function checkNewCategory(el) { document.getElementById('new-category-div').classList.toggle('hidden', el.value !== 'new_option'); }
        function checkNewArea(el) { document.getElementById('new-area-div').classList.toggle('hidden', el.value !== 'new_area_option'); }
    </script>
</body>
</html>
