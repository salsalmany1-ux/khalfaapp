<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خلفة - دليل الحرفيين والصيانة في الموصل</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- شريط التثبيت على الشاشة الرئيسية (PWA) -->
    <div id="pwa-install-banner" class="hidden bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 px-4 py-3 flex items-center justify-between shadow-lg text-sm font-bold z-50">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-mobile-screen-button text-lg"></i>
            <span>ثبّت تطبيق خلفة على شاشة موبايلك لسهولة الوصول!</span>
        </div>
        <button onclick="installPWA()" class="bg-slate-950 text-amber-400 px-3 py-1.5 rounded-lg text-xs hover:bg-slate-900 transition shadow">تثبيت الآن</button>
    </div>

    <!-- الشريط العلوي (Header) -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <!-- الشعار -->
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 border border-amber-400/30">
                <span class="text-slate-950 font-black text-xs tracking-tighter">خلفة</span>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-wide text-amber-400 leading-none">خلفة</h1>
                <p class="text-[10px] text-slate-400 tracking-wider">دليل الحرفيين بالموصل</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="openVipModal()" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 hover:bg-amber-500/20 transition">
                <i class="fa-solid fa-crown text-amber-400"></i> ميز حسابك VIP
            </button>
            <button onclick="openAdminLogin()" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-500/50 transition">
                <i class="fa-solid fa-lock text-sm"></i>
            </button>
        </div>
    </header>

    <!-- شريط الإعلانات للربح -->
    <div class="bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-amber-500/10 border-y border-amber-500/20 px-4 py-2 text-xs flex items-center justify-between text-amber-300">
        <div class="flex items-center gap-2 truncate">
            <span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[10px] font-black">إعلان</span>
            <span id="ad-text">سجل ورشتك أو محلك في الموصل الآن وضاعف زبائنك بسهولة!</span>
        </div>
        <button onclick="openAdvertiseModal()" class="text-amber-400 font-bold hover:underline shrink-0 mr-2">أعلن معنا</button>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-2xl mx-auto w-full p-4 flex-1 pb-24">

        <!-- حقل البحث والفلترة -->
        <div class="space-y-3 mb-6">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-slate-400"></i>
                <input type="text" id="search-input" oninput="filterKhalafas()" placeholder="ابحث عن حرفي، مهنة، أو حي (مثل: الأيسر، الزهور)..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl pr-11 pl-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>

            <!-- أقسام المهن (تتحدث ديناميكياً) -->
            <div id="categories-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterCategory('الكل')" class="category-btn bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap shadow-md transition">الكل</button>
                <button onclick="filterCategory('كهربائي')" class="category-btn bg-slate-900 border border-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs whitespace-nowrap hover:border-amber-500/50 transition">كهربائي</button>
                <button onclick="filterCategory('مجاري')" class="category-btn bg-slate-900 border border-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs whitespace-nowrap hover:border-amber-500/50 transition">مجاري</button>
            </div>
        </div>

        <!-- قائمة الحرفيين -->
        <div id="khalafas-list" class="space-y-4">
            <!-- يتم تعبئتها برمجياً -->
        </div>

    </main>

    <!-- زر عائم لتسجيل حرفي جديد -->
    <div class="fixed bottom-6 left-6 z-30">
        <button onclick="openRegisterModal()" class="bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black px-5 py-3.5 rounded-2xl shadow-xl shadow-amber-500/20 flex items-center gap-2 hover:scale-105 transition transform">
            <i class="fa-solid fa-plus text-base"></i> سجّل كـ خلفة
        </button>
    </div>

    <!-- نافذة تسجيل حرفي جديد -->
    <div id="register-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeRegisterModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-100"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-black text-amber-400 mb-4">انضم إلى دليل خلفة في الموصل</h3>
            <form id="register-form" onsubmit="submitKhalfa(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">الاسم أو اسم الورشة</label>
                    <input type="text" id="reg-name" required placeholder="مثال: أبو عمر لتصليح السبالت" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">المهنة / التخصص</label>
                    <select id="reg-category" onchange="checkNewCategory(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                        <option value="كهربائي">كهربائي</option>
                        <option value="مجاري">مجاري</option>
                        <option value="new_option">+ اقترح تخصصاً جديداً...</option>
                    </select>
                </div>
                <div id="new-category-div" class="hidden">
                    <label class="block text-xs text-amber-400 mb-1">اكتب التخصص الجديد (سيخضع لمراجعة الإدارة)</label>
                    <input type="text" id="reg-new-category" placeholder="مثال: كهربائي سيارات" class="w-full bg-slate-950 border border-amber-500/50 rounded-xl px-4 py-2.5 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">المنطقة في الموصل</label>
                    <input type="text" id="reg-area" required placeholder="مثال: الجانب الأيسر - حي الزهور" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-
